<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Univex Trade Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Rubik:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* base reset */
body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: fixed ledger sidebar + working pane; documents render as white A4 paper in both themes */
:root{
  --bg:#f5f7fc; --panel:#ffffff; --sunk:#eef2fa; --line:#d9e1f0; --fg:#0d1830; --muted:#5a6886;
  --ink:#f26b1d; --ink-fg:#ffffff; --accent:#f26b1d; --accent-soft:#fff0e6; --blue:#0f1f3d; --blue-soft:#e4e9f2;
  --ok:#1d7a46; --ok-soft:#dcf2e4; --warn:#b85c00; --warn-soft:#fdeedb; --bad:#b4232c; --bad-soft:#f9dcdd;
  --side:#0a1630; --side-fg:#c3d3f2; --side-hi:#ffffff;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1122; --panel:#111c33; --sunk:#18253f; --line:#26365a; --fg:#e8eefb; --muted:#93a3c4;
  --ink:#ff8a3d; --ink-fg:#1a0b00; --accent:#ff8a3d; --accent-soft:#3a1f0c; --blue:#7fa8f0; --blue-soft:#16264a;
  --ok:#5fd18f; --ok-soft:#133825; --warn:#f0b04d; --warn-soft:#3a2a10; --bad:#ff7a80; --bad-soft:#3d1518;
  --side:#050c1c; --side-fg:#9fb3da; --side-hi:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1122; --panel:#111c33; --sunk:#18253f; --line:#26365a; --fg:#e8eefb; --muted:#93a3c4;
  --ink:#ff8a3d; --ink-fg:#1a0b00; --accent:#ff8a3d; --accent-soft:#3a1f0c; --blue:#7fa8f0; --blue-soft:#16264a;
  --ok:#5fd18f; --ok-soft:#133825; --warn:#f0b04d; --warn-soft:#3a2a10; --bad:#ff7a80; --bad-soft:#3d1518;
  --side:#050c1c; --side-fg:#9fb3da; --side-hi:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{background:linear-gradient(180deg,var(--side),#132a52);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#f26b1d,#ff9a4d);color:#ffffff;box-shadow:0 2px 10px #f26b1d55;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em;overflow:hidden;flex:none}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand b{font-family:var(--display);font-weight:800;color:var(--side-hi);font-size:15px;display:block;line-height:1.1}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;font-weight:500}
nav button:hover{background:#ffffff12;color:var(--side-hi)}
nav button.on{background:#ffffff17;color:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent)}
nav .n{font-family:var(--mono);font-size:12px;opacity:.75}
.side-foot{margin-top:auto;font-size:12px;padding:0 6px;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--warn)}
.dot.live{background:#3fd08a}
main{min-width:0;padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--display);font-weight:800;font-size:26px;color:var(--blue);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:16px;margin:0;color:var(--blue)}
.sub{color:var(--muted);margin:4px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);box-shadow:0 2px 8px #f26b1d40}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px #0a16300d}
.pad{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px;border-top:3px solid var(--accent)}
.kpi:nth-child(even){border-top-color:var(--blue)}
.kpi label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
.kpi b{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;display:block;margin-top:4px}
.kpi small{color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
table.t .num{text-align:right}
.mono{font-family:var(--mono);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.draft{background:var(--sunk);color:var(--muted)}
.chip.issued{background:var(--blue-soft);color:var(--blue)}
.chip.released{background:var(--ok-soft);color:var(--ok)}
.chip.hold{background:var(--warn-soft);color:var(--warn)}
.chip.cancelled{background:var(--bad-soft);color:var(--bad)}
.chip.sample{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f.err input{border-color:var(--bad)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tabs .cnt{font-family:var(--mono);font-size:11px;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.tabs .cnt.b{background:var(--bad-soft);color:var(--bad)}
.lines input{border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:4px;width:100%;min-width:0}
.lines input:hover{border-color:var(--line)}
.lines input:focus{border-color:var(--accent);background:var(--bg)}
.lines td{padding:4px 4px;border-bottom:1px solid var(--line)}
.lines th{padding:8px 6px}
.lines tfoot td{font-weight:600;padding:10px 8px}
.hold{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:8px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);margin-bottom:16px}
.hold b{color:var(--warn)}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:10px;padding:10px 12px;border-radius:6px;background:var(--sunk);align-items:flex-start}
.chk i{font-style:normal;font-weight:700;width:18px;flex:none;text-align:center}
.chk.error i{color:var(--bad)}.chk.warn i{color:var(--warn)}.chk.ok i{color:var(--ok)}
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.doclist{display:flex;flex-direction:column;gap:6px}
.doclist button{all:unset;cursor:pointer;padding:11px 13px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.doclist button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.doclist button small{display:block;color:var(--muted);font-size:12px}
.doclist button:focus-visible{outline:2px solid var(--accent)}
.stage{background:var(--sunk);border-radius:8px;padding:18px;overflow:auto;max-height:80vh}
.stage .scaler{transform-origin:top left}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:6px;font-weight:500;z-index:50;max-width:min(420px,calc(100vw - 40px))}
.empty{padding:36px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:17px;margin-bottom:6px}
.search{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;min-width:0;width:260px;max-width:100%}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.log time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--panel);border-radius:10px;padding:20px;width:min(640px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.offscreen{position:absolute;left:-20000px;top:0}
.unsaved{color:var(--warn);font-weight:600;font-size:13px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));gap:12px}
  nav{flex-direction:row;overflow-x:auto}
  nav button{white-space:nowrap}
  .side-foot{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .docs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.log li{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Printed documents: Figma "Invoice Template for Freelancers" (teal #073B4C, Rubik), scaled to A4 ---------- */
.paper{--brand:#073b4c;width:794px;min-height:1123px;background:#f3f5f6;color:#333333;font:9px/1.4 "Rubik",Arial,Helvetica,sans-serif;position:relative;display:flex;flex-direction:column;box-shadow:0 2px 14px #0003;overflow:hidden}
.paper.land{width:1123px;min-height:794px}
.paper *{color:inherit}
.t-head{background:var(--brand);color:#ffffff;padding:17px 51px;font-size:28px;line-height:1.4;letter-spacing:.56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-head b{font-weight:600}
.t-head span{font-weight:400}
.t-band{background:rgba(7,59,76,.03);padding:30px 51px 40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.t-card{background:#ffffff;border-radius:7px;box-shadow:0 6px 12px rgba(73,100,98,.1);padding:20px 20px 14px;min-height:118px}
.t-card h4{margin:0 0 9px;font-size:12.6px;font-weight:600;color:var(--brand);letter-spacing:.25px;line-height:1.4}
.t-card p{margin:0 0 7px;font-size:9px;color:#333333;letter-spacing:.18px;line-height:1.4;word-break:break-word}
.t-card p:last-child{margin-bottom:0}
.t-card em{font-style:normal;color:#646464}
.t-body{background:#ffffff;border-radius:34px 34px 0 0;margin-top:-14px;padding:27px 51px 26px;flex:1;display:flex;flex-direction:column}
.t-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.t-h2{font-size:20px;font-weight:700;color:#646464;letter-spacing:.4px;margin:0 0 6px;line-height:1.4}
.t-h3{font-size:13px;font-weight:700;color:#646464;letter-spacing:.26px;margin:10px 0 4px}
.t-p{font-size:11px;line-height:1.76;color:#646464;margin:0 0 4px}
.t-tbl{width:100%;border-collapse:separate;border-spacing:0 5px;margin-top:8px}
.t-tbl th{font-size:10.5px;font-weight:700;color:#646464;text-align:left;padding:2px 9px 6px;letter-spacing:.2px;line-height:1.5;white-space:nowrap}
.t-tbl tr.rule td{background:transparent;padding:0 0 3px}
.t-tbl tr.rule div{height:2.4px;border-radius:4px;background:var(--brand)}
.t-tbl td{background:rgba(7,59,76,.05);padding:8px 9px;font-size:9.5px;color:#646464;letter-spacing:.15px;line-height:1.5;vertical-align:top}
.t-tbl td:first-child{border-radius:4px 0 0 4px}
.t-tbl td:last-child{border-radius:0 4px 4px 0}
.t-tbl .r{text-align:right;white-space:nowrap}
.t-tbl td b{font-weight:500;color:#4a4a4a}
.t-sum{display:flex;justify-content:space-between;align-items:center;gap:16px;border-radius:4px;padding:9px 19px;font-size:13.6px;letter-spacing:.27px;line-height:1.5;margin-top:9px}
.t-sum span:last-child{text-align:right}
.t-sum.total{background:rgba(7,59,76,.1);color:var(--brand);font-weight:700;padding:9px 15px}
.t-sum.total span:first-child{text-transform:uppercase}
.t-sum.adv{background:rgba(7,59,76,.08);color:var(--brand);font-weight:500;font-size:11.5px}
.t-sum.disc{background:rgba(24,109,60,.08);color:#186d3c;font-weight:500;font-size:11.5px}
.t-sum.hold{background:#fdeedb;color:#9a5200;font-weight:600;font-size:11.5px}
.t-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.t-opt{background:rgba(7,59,76,.05);border-radius:4px;padding:5px 9px;font-size:9.5px;color:#646464;display:flex;align-items:center;gap:7px}
.t-opt.on{background:rgba(7,59,76,.1);color:var(--brand);font-weight:600}
.t-tick{width:10px;height:10px;border-radius:2px;border:1.2px solid var(--brand);flex:none;display:grid;place-items:center;font-size:8px;line-height:1;color:#ffffff}
.t-opt.on .t-tick{background:var(--brand)}
.t-small{font-size:8.5px;color:#7a7a7a;line-height:1.5;margin:8px 0 0}
.t-sign{display:flex;justify-content:space-between;gap:30px;margin-top:auto;padding-top:40px}
.t-sign>div{flex:1;max-width:230px;border-top:1px solid #a9b6bb;padding-top:6px;font-size:9px;color:#646464;font-weight:500;letter-spacing:.18px;position:relative;text-align:center}
.t-sign>div.blank{border-top:0}
.t-sign img{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);max-height:70px;max-width:150px;opacity:.92}
.t-footwrap{background:#ffffff}
.t-foot{background:#f7fafa;border-radius:34px 34px 0 0;padding:30px 50px 28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.t-logo{width:70px;height:70px;border-radius:50%;background:#0f7166;display:grid;place-items:center;overflow:hidden;flex:none;color:#ffffff;font:700 22px "Rubik",Arial,sans-serif;letter-spacing:.5px}
.t-logo.img{background:#ffffff;box-shadow:0 0 0 1px rgba(7,59,76,.08)}
.t-logo img{max-width:52px;max-height:52px}
.t-fcol{font-size:10.7px;line-height:1.56;color:#646464;letter-spacing:.21px;padding:3px;max-width:250px;word-break:break-word}
.t-fcol b{font-weight:600;display:block}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden;z-index:3}
.wm span{transform:rotate(-30deg);font:700 62px "Rubik",Arial,sans-serif;color:#c0262d;opacity:.13;white-space:nowrap;letter-spacing:.04em}
.wm.draft span{color:#073b4c}
.qr{width:72px;height:72px;flex:none}
.qr img,.qr canvas{width:72px!important;height:72px!important}

/* login gate */
#gate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(900px 500px at 90% 0%,#f26b1d33,transparent 60%),linear-gradient(160deg,#0a1630,#132a52);overflow:auto}
.g-card{background:var(--panel);color:var(--fg);width:min(420px,100%);border-radius:14px;padding:30px 28px;box-shadow:0 24px 60px #0007;display:flex;flex-direction:column;gap:14px}
.g-card h1{font-size:24px;margin:4px 0 0}
.g-sub{color:var(--muted);margin:0;line-height:1.5}
.g-sub code{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:1px 6px;border-radius:4px}
.g-brand{display:flex;gap:12px;align-items:center}
.g-brand .mark{width:42px;height:42px;font-size:16px}
.g-brand b{display:block;font-family:var(--display);font-size:17px}
.g-brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.g-form{display:flex;flex-direction:column;gap:12px}
.g-form .btn{padding:11px 14px;font-size:15px}
.g-err{color:var(--bad);margin:0;min-height:1.2em;font-size:13px}
.g-err:empty{min-height:0}
.g-link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;align-self:flex-start}
.g-link:focus-visible{outline:2px solid var(--accent)}
.acct{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:8px;background:#ffffff0d}
.acct b{color:var(--side-hi);font-size:13px;word-break:break-all}
.acct .row{justify-content:space-between}
.acct button{all:unset;cursor:pointer;font-size:12px;color:var(--side-hi);text-decoration:underline}
.rolechip{font-size:11px;padding:1px 8px;border-radius:999px;background:#f26b1d33;color:#ffb27f;font-weight:600}
/* role-based controls */
body.ro [data-act]:not([data-act=pdf]):not([data-act=exportCsv]):not([data-act=signOut]):not([data-act=backup]){display:none}
body.ro .ro-hide{display:none}
body:not(.admin) .admin-only{display:none}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="mark" id="sideMark">UV</div><div><b id="sideName">Univex Trading</b><span>Trade documents</span></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="modeTag"><span class="dot"></span>Connecting…</span><div class="acct" id="acct"></div></div>
  </aside>
  <main id="main"></main>
</div>
<div id="off" class="offscreen" aria-hidden="true"></div>
<div id="modalRoot"></div>
<div id="gate"><div class="g-card"><p class="g-sub">Loading…</p></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
/* ================= State & storage ================= */
const S={orders:{},products:{},parties:{},boes:{},config:{}};

async function put(coll,id,data){
  if(!canWrite(coll)){toast(coll==='config'?'Only an admin can change company settings.':'Your account is view-only. Ask an admin for staff access.');throw new Error('read-only')}
  const had=Object.prototype.hasOwnProperty.call(S[coll],id),prev=S[coll][id];
  S[coll][id]=clone(data);render();
  const {error}=await SB.from('app_docs').upsert({collection:coll,id,data});
  if(error){if(had)S[coll][id]=prev;else delete S[coll][id];render();toast(dbMsg(error));throw error}
}
async function del(coll,id){
  if(!canWrite(coll)){toast('Your account can’t delete this. Ask an admin.');throw new Error('read-only')}
  const prev=S[coll][id];delete S[coll][id];render();
  const {error}=await SB.from('app_docs').delete().match({collection:coll,id});
  if(error){S[coll][id]=prev;render();toast(dbMsg(error));throw error}
}
function dbMsg(e){
  const m=(e&&e.message)||'';
  if((e&&e.code==='42501')||/row-level security|permission denied/i.test(m))return 'Your account doesn’t have permission to change this. Ask an admin.';
  if(/jwt|session|token/i.test(m))return 'Your session expired. Sign in again.';
  if(/failed to fetch|network|load failed/i.test(m))return 'Couldn’t reach the database. Check your internet connection and try again.';
  if(/payload|too large/i.test(m))return 'That record is too large. Try a smaller logo or stamp image.';
  return 'Couldn’t save: '+m;
}

/* ---------- Boot & session ---------- */
async function boot(){
  if(!configured()){gate('setup');return}
  if(!window.supabase||!window.supabase.createClient){gate('nolib');return}
  SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let recovering=RECOVERY;
  SB.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'||(recovering&&session&&event!=='SIGNED_OUT')){SESSION=session;gate('newpass');return}
    if(event==='SIGNED_OUT'||!session){teardown();gate('login');return}
    const changed=!SESSION||SESSION.user.id!==session.user.id;
    SESSION=session;
    if(changed||!READY)setTimeout(startApp,0);
  });
  window.__doneRecovery=()=>{recovering=false;history.replaceState(null,'',location.pathname);startApp()};
}
async function startApp(){
  if(STARTING||!SESSION)return;STARTING=true;
  try{
    ME=SESSION.user.id;
    gate('loading');
    const {data:prof,error}=await SB.from('profiles').select('id,email,full_name,role,created_at').eq('id',ME).maybeSingle();
    if(error){gate('dberror',error.message);return}
    if(!prof){gate('noprofile');return}
    MYPROFILE=prof;ROLE=prof.role;
    await loadProfiles();
    const ok=await loadAll();if(!ok)return;
    subscribe();
    READY=true;gate(null);applyRole();render();
  }finally{STARTING=false}
}
async function loadProfiles(){
  const {data}=await SB.from('profiles').select('id,email,full_name,role,created_at').order('created_at');
  TEAM=data||[];PROFILES={};TEAM.forEach(p=>PROFILES[p.id]=p.full_name||p.email||'A teammate');
  const me=TEAM.find(p=>p.id===ME);if(me){MYPROFILE=me;ROLE=me.role}
}
async function loadAll(){
  COLLS.forEach(c=>S[c]={});
  const page=1000;let from=0;
  for(;;){
    const {data,error}=await SB.from('app_docs').select('collection,id,data').order('collection').order('id').range(from,from+page-1);
    if(error){gate('dberror',error.message);return false}
    data.forEach(r=>{if(S[r.collection])S[r.collection][r.id]=r.data});
    if(data.length<page)break;from+=page;
  }
  return true;
}
function subscribe(){
  if(CHANNEL)SB.removeChannel(CHANNEL);
  CHANNEL=SB.channel('univex-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'app_docs'},p=>{
      if(p.eventType==='DELETE'){const o=p.old||{};if(S[o.collection])delete S[o.collection][o.id]}
      else{const n=p.new||{};if(S[n.collection])S[n.collection][n.id]=n.data}
      render();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},async()=>{await loadProfiles();applyRole();render()})
    .subscribe(status=>{LIVE=status==='SUBSCRIBED';setMode()});
}
function teardown(){
  if(CHANNEL&&SB)SB.removeChannel(CHANNEL);CHANNEL=null;
  COLLS.forEach(c=>S[c]={});SESSION=null;ME=null;ROLE=null;MYPROFILE=null;TEAM=[];PROFILES={};READY=false;LIVE=false;
  UI.view='dash';UI.edit=null;UI.dirty=false;
}
function applyRole(){

document.addEventListener('submit',async e=>{

      toast('Password saved');window.__doneRecovery();

const MOVES=['Free Zone Internal Transfer','Free Zone Bill of Entry','Import','Temporary Exit','Export'];
const PAYS=['CDR Cash','CDR Bank','Deposit','Credit A/C','Stan.G','Bank G','FTT','Alcohol','Other'];
const CURS=['AED','USD','EUR','GBP','CNY','SAR','INR'];
const STATUS={draft:'Draft',issued:'Issued',hold:'On hold',released:'Released',cancelled:'Cancelled'};
const party=id=>S.parties[id]||null;
const lineAmt=l=>num(l.qty)*num(l.price);
function totals(o){
  const t={qty:0,net:0,gross:0,cbm:0,amt:0};
  (o.lines||[]).forEach(l=>{const q=num(l.qty);t.qty+=q;t.net+=q*num(l.uNet);t.gross+=q*num(l.uGross);t.cbm+=q*num(l.uCbm);t.amt+=lineAmt(l)});
  t.aed=t.amt*(o.currency==='AED'?1:num(o.fx||1));
  return t;
}
function effStatus(o){return o.hold&&o.hold.on&&o.status!=='cancelled'&&o.status!=='released'?'hold':o.status}
function seqOf(no){const m=String(no||'').match(/(\d+)\s*$/);return m?+m[1]:0}
function nextNo(date){
  const s=settings();const d=date||today();const yy=d.slice(2,4),mm=d.slice(5,7);
  let max=num(s.startSeq)-1;Object.values(S.orders).forEach(o=>{max=Math.max(max,seqOf(o.no))});
  return `${s.prefix}/ORD/${yy}/${mm}/${max+1}`;
}
function consolidated(o){
  const m=new Map();
  (o.lines||[]).forEach(l=>{
    const k=(l.sku||'')+'|'+(l.coo||'');
    if(!m.has(k))m.set(k,{...l,qty:0,net:0,gross:0,cbm:0});
    const r=m.get(k),q=num(l.qty);r.qty+=q;r.net+=q*num(l.uNet);r.gross+=q*num(l.uGross);r.cbm+=q*num(l.uCbm);
  });
  return [...m.values()];
}
function boeOut(boe,sku,exceptId){
  let n=0;Object.entries(S.orders).forEach(([id,o])=>{if(id===exceptId||o.status==='cancelled'||o.boe!==boe)return;(o.lines||[]).forEach(l=>{if(l.sku===sku)n+=num(l.qty)})});return n;
}
function boeIn(boe,sku){let n=0;Object.values(S.boes).forEach(b=>{if(b.boe===boe&&b.sku===sku)n+=num(b.qty)});return n}
function checks(o,id){
  const r=[];const add=(level,msg)=>r.push({level,msg});
  if(!o.consigneeId)add('error','Choose a consignee (the party receiving ownership).');
  if(!o.boe)add('error','Enter the Free Zone Bill of Entry number.');
  else if(!/^\d{3}-\d{8}-\d{2}$/.test(o.boe))add('warn',`BOE "${o.boe}" doesn’t match the usual Dubai Customs format 000-00000000-00.`);
  if(!(o.lines||[]).length)add('error','Add at least one item line.');
  (o.lines||[]).forEach((l,i)=>{
    const n=`Line ${i+1}${l.sku?' ('+l.sku+')':''}`;
    if(!l.sku)add('error',`${n}: SKU is missing.`);
    if(!/^\d{8}$/.test(String(l.hs||'').replace(/\D/g,''))||String(l.hs||'').replace(/\D/g,'').length!==8)add('warn',`${n}: HS code should be 8 digits (GCC tariff).`);
    if(!l.coo)add('warn',`${n}: country of origin is blank.`);
    if(num(l.qty)<=0)add('error',`${n}: quantity must be above zero.`);
    if(num(l.price)<=0)add('warn',`${n}: unit price is zero.`);
    if(num(l.uNet)>num(l.uGross))add('error',`${n}: net weight is higher than gross weight.`);
    if(num(l.uNet)<=0)add('warn',`${n}: unit weight is zero, so totals will show 0 kg.`);
  });
  if(o.boe){
    const regs=Object.values(S.boes).filter(b=>b.boe===o.boe);
    if(!regs.length)add('warn',`BOE ${o.boe} isn’t in the BOE register, so stock balance can’t be checked.`);
    else consolidated(o).forEach(l=>{
      const inn=boeIn(o.boe,l.sku),out=boeOut(o.boe,l.sku,id),avail=inn-out;
      if(!inn)add('error',`${l.sku} was not received under BOE ${o.boe}.`);
      else if(l.qty>avail)add('error',`${l.sku}: ${fmtQ(l.qty)} requested but only ${fmtQ(avail)} left on BOE ${o.boe}.`);
    });
  }
  if(o.currency!=='AED'&&num(o.fx)<=0)add('error','Enter the exchange rate to AED.');
  if(o.hold&&o.hold.on)add('warn',`Order is on hold${o.hold.ref?' ('+o.hold.ref+')':''}. Delivery Advice and Transfer of Ownership print with a DO NOT RELEASE watermark until the hold is lifted.`);
  if(!r.some(x=>x.level!=='ok'))add('ok','All checks passed. Documents are consistent across invoice, packing list, delivery advice and transfer.');
  return r;
}
function wordsInt(n){
  const a=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const w=n=>{if(n<20)return a[n];if(n<100)return b[Math.floor(n/10)]+(n%10?'-'+a[n%10]:'');if(n<1000)return a[Math.floor(n/100)]+' Hundred'+(n%100?' and '+w(n%100):'');
    for(const [v,s] of [[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']])if(n>=v)return w(Math.floor(n/v))+' '+s+(n%v?(n%v<100?' and ':' ')+w(n%v):'');};
  return w(Math.floor(n));
}
function amountWords(x,cur){
  const names={AED:['UAE Dirhams','Fils'],USD:['US Dollars','Cents'],EUR:['Euros','Cents'],GBP:['Pounds Sterling','Pence'],CNY:['Chinese Yuan','Fen'],SAR:['Saudi Riyals','Halalas'],INR:['Indian Rupees','Paise']}[cur]||[cur,'Cents'];
  const i=Math.floor(Math.round(x*100)/100),f=Math.round((x-i)*100);
  return `${names[0]} ${wordsInt(i)}${f?` and ${wordsInt(f)} ${names[1]}`:''} Only`;
}

const initials=s=>String(s||'U').split(/\s+/).filter(w=>!/^(llc|fze|fzco|l\.l\.c|trading|company|co)$/i.test(w)).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'U';
let rT=0;
function render(){cancelAnimationFrame(rT);rT=requestAnimationFrame(doRender)}
function doRender(){
  if(!READY)return;
  renderNav();

/* ---------- PDF ---------- */
async function downloadPdf(){
  const o=curOrder();
  if(!window.html2canvas||!window.jspdf){toast('The PDF engine didn’t load. Check your connection and reload the page.');return}
  const kinds=UI.doc==='all'?['ci','pl','da','to']:[UI.doc];
  toast('Building PDF…',60000);
  try{
    const {jsPDF}=window.jspdf;let pdf=null;const off=$('#off');
    for(const k of kinds){
      off.innerHTML=paper(k,o);off.querySelectorAll('[data-qr]').forEach(drawQr);
      await new Promise(r=>setTimeout(r,60));
      const node=off.firstElementChild;const canvas=await html2canvas(node,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      const orient='p';
      if(!pdf)pdf=new jsPDF({orientation:orient,unit:'pt',format:'a4'});else pdf.addPage('a4',orient);
      const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
      const img=canvas.toDataURL('image/jpeg',0.92),h=canvas.height*pw/canvas.width;
      if(h<=ph+2)pdf.addImage(img,'JPEG',0,0,pw,Math.min(h,ph));
      else{for(let y=0;y<h;y+=ph){if(y>0)pdf.addPage('a4',orient);pdf.addImage(img,'JPEG',0,-y,pw,h)}}
    }
    off.innerHTML='';
    const label={ci:'CommercialInvoice',pl:'PackingList',da:'DeliveryAdvice',to:'TransferOfOwnership',all:'DocumentPack'}[UI.doc];
    await saveFile(`${label}_${o.no.replace(/[^\w-]+/g,'-')}.pdf`,pdf.output('blob'));
  }catch(e){toast('Couldn’t build the PDF. Try again, or try one document at a time.')}
}
async function saveFile(name,data){
  const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Saved '+name);
}

  $('#mf').insertAdjacentHTML('beforeend',`<datalist id="skuList2">${Object.values(S.products).map(p=>`<option value="${esc(p.sku)}">`).join('')}</datalist>`)}

/* ---------- Order actions ---------- */
function markDirty(){UI.dirty=true;const d=$('#dirtyTag');if(d)d.textContent='Unsaved changes'}
function refreshOrderSide(){
  const o=curOrder();const t=totals(o);
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
  set('sumLine',sumLine(o));set('tQty',fmtQ(t.qty));set('tNet',fmt(t.net,3));set('tGross',fmt(t.gross,3));set('tCbm',fmt(t.cbm,4));set('tAmt',fmt(t.amt));
  o.lines.forEach((l,i)=>set('amt'+i,fmt(lineAmt(l))));
  if(UI.tab==='docs')mountDoc();
}
function logAct(o,action){o.log=o.log||[];o.log.push({at:nowIso(),by:ME||'',action})}
async function saveOrder(msg){
  const o=curOrder();let id=UI.orderId;
  if(!id||!S.orders[id]){
    if(!id)id=UI.orderId=uid();
    if(Object.values(S.orders).some(x=>x.no===o.no)){o.no=nextNo(o.date)}
  }
  o.updatedAt=nowIso();
  o.lines=o.lines.filter(l=>l.sku||l.desc||num(l.qty)>1||num(l.price));
  if(!o.lines.length)o.lines=[blankLine()];
  if(msg)logAct(o,msg);else if(S.orders[id])logAct(o,'Edited');
  try{await put('orders',id,clone(o));UI.dirty=false;UI.edit=null;toast('Order '+o.no+' saved');render()}catch(e){}
}
function applyProduct(l,p){Object.assign(l,{desc:p.desc,hs:p.hs,coo:p.coo,uom:p.uom||'PIECE',price:num(p.price),uNet:num(p.uNet),uGross:num(p.uGross),uCbm:num(p.uCbm)})}
async function setStatus(st,label){const o=curOrder();o.status=st;if(st==='released')o.releasedAt=nowIso();await saveOrder(label)}
function exportCsv(){
  const head=['Order no','Date','Status','Customer','Consignee','BOE','Movement','Currency','Qty','Net kg','Gross kg','CBM','Amount','Value AED','Hold ref'];
  const rows=Object.values(S.orders).sort((a,b)=>seqOf(a.no)-seqOf(b.no)).map(o=>{const t=totals(o);return [o.no,o.date,STATUS[effStatus(o)],(party(o.customerId)||{}).name,(party(o.consigneeId)||{}).name,o.boe,o.movement,o.currency,t.qty,t.net.toFixed(3),t.gross.toFixed(3),t.cbm.toFixed(4),t.amt.toFixed(2),t.aed.toFixed(2),o.hold&&o.hold.on?o.hold.ref:'']});
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  saveFile(`Univex_Orders_${today()}.csv`,'﻿'+csv);
}
async function resizeImg(file,max){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png');
}
async function loadSample(){
  const P='p-moveocean',Q='p-hezaartoo',R='p-blink';
  const pw={sku:'JF-190120240331-CFI-ZCT2WX (WHITE)',desc:'Sony PlayStation 5 DualSense Controller White UAE Version',hs:'95049000',coo:'CHINA',uom:'PIECE',price:192,currency:'AED',uNet:.34,uGross:.34,uCbm:.0025};
  const pb={sku:'JF-190120240332-CFI-ZCT2W0 1X (BLACK)',desc:'Sony PlayStation 5 DualSense Controller Black',hs:'95049000',coo:'CHINA',uom:'PIECE',price:192,currency:'AED',uNet:.34,uGross:.34,uCbm:.0025};
  try{
    await put('parties',P,{name:'MOVE OCEAN LOGISTICS',role:'Consignee',address:'Jebel Ali Free Zone',city:'Dubai',country:'United Arab Emirates'});
    await put('parties',Q,{name:'HEZAARTOO ELECTRONICS TRADING LLC',role:'Bill to',city:'Dubai',country:'United Arab Emirates'});
    await put('parties',R,{name:'BLINK TECHNOLOGIES FZCO',role:'Customer',city:'Dubai',country:'United Arab Emirates'});
    await put('products','sku-ps5-white',pw);await put('products','sku-ps5-black',pb);
    await put('boes','boe-sample-white',{boe:'502-00462988-26',date:'2026-09-28',sku:pw.sku,qty:500,ref:'Sample inbound'});
    await put('boes','boe-sample-black',{boe:'502-00462988-26',date:'2026-09-28',sku:pb.sku,qty:500,ref:'Sample inbound'});
    const L=x=>{const c={...x};delete c.currency;return c};
    const o=blankOrder();Object.assign(o,{sample:true,date:'2026-10-01',status:'issued',customerId:R,consigneeId:P,billToId:Q,boe:'502-00462988-26',poRef:'T261001819932S1',hold:{on:true,ref:'T261001819932S1',reason:'Hezaartoo Electronics Trading LLC — do not release'},lines:[{...L(pw),qty:500},{...L(pb),qty:480},{...L(pb),qty:20}]});
    await put('orders','sample-order-1',o);toast('Sample data loaded');
  }catch(e){}
}

/* ================= Events ================= */
document.addEventListener('click',async e=>{
  if(e.target.closest('#gate')&&!e.target.closest('[data-act]'))return;
  const t=e.target.closest('button,[data-open],[data-edit-product],[data-edit-party],[data-edit-boe],[data-close]');if(!t)return;
  if(t.dataset.close&&e.target===t){closeModal();return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.open){go('order',{orderId:t.dataset.open,tab:'details',edit:null});return}
  if(t.dataset.editProduct){editProduct(t.dataset.editProduct);return}
  if(t.dataset.editParty){editParty(t.dataset.editParty);return}
  if(t.dataset.editBoe){editBoe(t.dataset.editBoe);return}
  if(t.dataset.tab){UI.tab=t.dataset.tab;const d=UI.dirty;UI.dirty=false;doRender();UI.dirty=d;if(d)markDirty();return}
  if(t.dataset.doc){UI.doc=t.dataset.doc;document.querySelectorAll('[data-doc]').forEach(b=>b.classList.toggle('on',b===t));mountDoc();return}
  const a=t.dataset.act;if(!a)return;
  const o=UI.view==='order'?curOrder():null;
  ({
    newOrder:()=>go('order',{orderId:null,tab:'details',edit:null}),
    loadSample,
    signOut,
    saveUser:()=>saveUser(t.dataset.id),
    saveOrder:()=>saveOrder(),
    addLine:()=>{o.lines.push(blankLine());markDirty();const d=UI.dirty;UI.dirty=false;doRender();UI.dirty=d;markDirty();const el=document.getElementById(`l${o.lines.length-1}_sku`);el&&el.focus()},
    rmLine:()=>{o.lines.splice(+t.dataset.i,1);if(!o.lines.length)o.lines.push(blankLine());UI.dirty=false;doRender();markDirty()},
    issue:()=>setStatus('issued','Issued'),
    release:()=>confirmBox('Mark as released?','This records that goods left the warehouse and locks the order.','Mark released',()=>setStatus('released','Released to '+((party(o.consigneeId)||{}).name||'consignee'))),
    reopen:()=>confirmBox('Reopen this order?','It returns to Issued so it can be edited. The history keeps a record.','Reopen',()=>setStatus('issued','Reopened')),
    liftHold:()=>confirmBox('Lift the hold?','Release documents will print without the DO NOT RELEASE watermark.','Lift hold',()=>{const r=o.hold.ref;o.hold={on:false,ref:'',reason:''};saveOrder('Hold lifted'+(r?' ('+r+')':''))}),
    dupOrder:()=>{const c=clone(o);Object.assign(c,{no:nextNo(today()),date:today(),status:'draft',sample:false,hold:{on:false,ref:'',reason:''},createdAt:nowIso(),createdBy:ME||'',log:[{at:nowIso(),by:ME||'',action:'Duplicated from '+o.no}]});UI.orderId=null;UI.edit=c;UI.tab='details';UI.dirty=true;doRender();markDirty();toast('Copy created. Save to keep it.')},
    pdf:downloadPdf,
    quickParty:()=>editParty(null,nid=>{if(!o.consigneeId)o.consigneeId=nid;markDirty();const d=UI.dirty;UI.dirty=false;setTimeout(()=>{doRender();UI.dirty=d;markDirty()},50)}),
    exportCsv,
    editProduct:()=>editProduct(),editParty:()=>editParty(),editBoe:()=>editBoe(),
    saveSettings:async()=>{const s=settings();document.querySelectorAll('[data-s]').forEach(i=>s[i.dataset.s]=i.dataset.s==='startSeq'?num(i.value):i.value.trim());await put('config','settings',s);toast('Settings saved')},
    rmImg:async()=>{await del('config',t.dataset.k);toast('Image removed')},
    backup:()=>saveFile(`Univex_TradeDocs_Backup_${today()}.json`,JSON.stringify({version:1,exported:nowIso(),...S},null,1)),
  }[a]||(()=>{}))();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();
  if(e.key==='Enter'&&e.target.matches('tr[tabindex]'))e.target.click();
  if((e.ctrlKey||e.metaKey)&&e.key==='s'&&UI.view==='order'){e.preventDefault();saveOrder()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){UI.q=el.value;doRender();return}
  if(UI.view!=='order')return;
  const o=curOrder();
  if(el.dataset.o){o[el.dataset.o]=el.value;markDirty();refreshOrderSide();return}
  if(el.dataset.hold&&el.type!=='checkbox'){o.hold[el.dataset.hold]=el.value;markDirty();return}
  if(el.dataset.l!=null){const l=o.lines[+el.dataset.l];l[el.dataset.k]=el.value;markDirty();refreshOrderSide()}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='fstatus'){UI.status=el.value;doRender();return}
  if(el.dataset.img){const f=el.files[0];if(!f)return;try{const data=await resizeImg(f,el.dataset.img==='logo'?360:420);if(data.length>240000){toast('That image is too large even after resizing. Try a simpler PNG.');return}await put('config',el.dataset.img,{data});toast(el.dataset.img==='logo'?'Logo saved':'Stamp saved')}catch(err){toast('Couldn’t read that image. Use a PNG or JPG.')}return}
  if(el.id==='restoreIn'){const f=el.files[0];if(!f)return;try{const d=JSON.parse(await f.text());for(const c of ['orders','products','parties','boes','config'])for(const [id,v] of Object.entries(d[c]||{}))await put(c,id,v);toast('Backup restored')}catch(err){toast('That file isn’t a valid backup.')}return}
  if(UI.view!=='order')return;
  const o=curOrder();
  if(el.dataset.hold==='on'){o.hold.on=el.checked;markDirty();return}
  if(el.dataset.o==='currency'){o.currency=el.value;if(el.value==='AED')o.fx=1;markDirty();const d=UI.dirty;UI.dirty=false;doRender();UI.dirty=d;markDirty();return}
  if(el.dataset.o==='date'&&!S.orders[UI.orderId]){o.no=nextNo(el.value);const n=$('#o_no');if(n)n.value=o.no}
  if(el.dataset.k==='sku'){const p=Object.values(S.products).find(p=>p.sku===el.value.trim());if(p){applyProduct(o.lines[+el.dataset.l],p);UI.dirty=false;doRender();markDirty();const q=document.getElementById(`l${el.dataset.l}_qty`);q&&q.focus()}}
});
window.addEventListener('resize',()=>{if(UI.view==='order'&&UI.tab==='docs')mountDoc()});
let tT;function toast(m,ms=3200){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;clearTimeout(tT);tT=setTimeout(()=>el.remove(),ms)}
boot();
</script>
